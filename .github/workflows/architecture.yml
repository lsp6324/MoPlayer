name: Architecture and application protocols

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q tests/test_architecture.py tests/test_application.py tests/test_file_workflows.py tests/test_archive_folders.py tests/test_archive_workflows.py tests/test_archive_cleanup.py tests/test_cleanup_workflow.py tests/test_library_controller.py tests/test_library_repository.py tests/test_storage_settings.py tests/test_release.py
